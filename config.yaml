github:
  owner: ''
  repo: daily-paper-reader
arxiv_paper_setting:
  mode: standard
  days_window: 9
  docs_dir: docs
  prefer_supabase_read: true
supabase:
  enabled: true
  url: https://lyucdwgefyfbmaiopjbk.supabase.co
  anon_key: sb_publishable_lX-oi64Uxyd7SIVv3_w2Uw_MTOojeKq
  papers_table: arxiv_papers
  use_vector_rpc: true
  vector_rpc: match_arxiv_papers
  vector_rpc_ann: match_arxiv_papers
  vector_rpc_exact: match_arxiv_papers_exact
  use_bm25_rpc: true
  bm25_rpc: match_arxiv_papers_bm25
  sync_table: arxiv_sync_status
  sync_success_value: success
  schema: public
subscriptions:
  schema_migration:
    stage: A
    diff_threshold_pct: 15
  keyword_recall_mode: or
  intent_profiles:
    - tag: TTA
      description: 测试时适应
      enabled: true
      paper_sources:
        - arxiv
        - biorxiv
      keywords:
        - keyword: test-time adaptation
          keyword_cn: 测试时适应
          query: adapting a pretrained model to unlabeled test data during inference
        - keyword: model adaptation
          keyword_cn: 模型适应
          query: adjusting model behavior for a target deployment environment
        - keyword: distribution shift
          keyword_cn: 分布偏移
          query: performance degradation caused by changes between training and test distributions
        - keyword: continual learning
          keyword_cn: 持续学习
          query: learning sequentially from non-stationary data without catastrophic forgetting
        - keyword: pseudo-label training
          keyword_cn: 伪标签训练
          query: training with generated pseudo-labels on unlabeled test samples
        - keyword: robustness evaluation
          keyword_cn: 鲁棒性评估
          query: measuring model robustness under distribution shifts and corrupted inputs
      intent_queries:
        - query: Methods for adapting a pretrained model to unlabeled test data during inference
          query_cn: 在推理阶段将预训练模型适应到无标签测试数据的方法
          enabled: true
          source: manual
          note: ''
        - query: Source free test time adaptation under distribution shift
          query_cn: 分布偏移下的无源测试时适应
          enabled: true
          source: manual
          note: ''
        - query: Online continual adaptation of neural networks without access to training data
          query_cn: 无需访问训练数据的神经网络在线持续适应
          enabled: true
          source: manual
          note: ''
        - query: Evaluating robustness of test time adaptation methods across benchmark datasets
          query_cn: 在基准数据集上评估测试时适应方法的鲁棒性
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-11-02T13:54:12.896Z'
    - tag: continual
      description: 持续学习
      enabled: true
      paper_sources:
        - arxiv
        - biorxiv
      keywords:
        - keyword: continual learning
          keyword_cn: 持续学习
          query: methods for learning sequentially from non-stationary data without forgetting prior knowledge
        - keyword: catastrophic forgetting
          keyword_cn: 灾难性遗忘
          query: loss of previously learned knowledge when a model is trained on new tasks
        - keyword: parameter isolation
          keyword_cn: 参数隔离
          query: allocating separate or partially separate model parameters for different tasks
        - keyword: stability plasticity dilemma
          keyword_cn: 稳定性与可塑性困境
          query: balancing retention of old knowledge with adaptation to new information
      intent_queries:
        - query: How can neural networks learn a sequence of tasks without forgetting previously acquired knowledge?
          query_cn: 神经网络如何按任务序列学习而不遗忘先前获得的知识？
          enabled: true
          source: manual
          note: ''
        - query: What replay, regularization, and parameter isolation strategies support continual learning?
          query_cn: 哪些回放、正则化和参数隔离策略支持持续学习？
          enabled: true
          source: manual
          note: ''
        - query: How should forward transfer and backward transfer be measured in lifelong learning systems?
          query_cn: 在终身学习系统中应如何衡量前向迁移和后向迁移？
          enabled: true
          source: manual
          note: ''
        - query: How can models adapt to non stationary data distributions while retaining prior skills?
          query_cn: 模型如何在适应非平稳数据分布的同时保留先前技能？
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-11-02T13:54:45.005Z'
    - tag: audio-video
      description: 音视频表征学习
      enabled: true
      paper_sources:
        - arxiv
        - biorxiv
      keywords:
        - keyword: audio-visual representation learning
          keyword_cn: 音视频表征学习
          query: learning joint representations from audio and video data
        - keyword: multimodal representation learning
          keyword_cn: 多模态表征学习
          query: learning shared representations across multiple modalities such as audio and video
        - keyword: cross-modal alignment
          keyword_cn: 跨模态对齐
          query: aligning audio and visual features in a common semantic space
        - keyword: multimodal fusion
          keyword_cn: 多模态融合
          query: fusing audio and visual information for joint multimodal understanding
        - keyword: cross-modal retrieval
          keyword_cn: 跨模态检索
          query: retrieving relevant video or audio content across modalities
      intent_queries:
        - query: Methods for learning joint representations from audio and video modalities.
          query_cn: 从音频和视频模态中学习联合表征的方法。
          enabled: true
          source: manual
          note: ''
        - query: Cross modal alignment and fusion between audio and visual streams for video understanding.
          query_cn: 面向视频理解的音视频流跨模态对齐与融合。
          enabled: true
          source: manual
          note: ''
        - query: Audio visual correspondence learning for retrieval and downstream multimodal tasks.
          query_cn: 面向检索和下游多模态任务的音视频对应关系学习。
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-11-02T13:56:01.822Z'
    - tag: MoE
      description: 混合专家模型
      enabled: true
      paper_sources:
        - arxiv
      keywords:
        - keyword: mixture of experts
          keyword_cn: 混合专家模型
          query: mixture of experts neural network architecture
        - keyword: sparse mixture of experts
          keyword_cn: 稀疏混合专家模型
          query: sparse mixture of experts models with conditional computation
        - keyword: expert routing
          keyword_cn: 专家路由
          query: token routing to specialized expert networks
        - keyword: load balancing loss
          keyword_cn: 负载均衡损失
          query: auxiliary load balancing loss for expert utilization
      intent_queries:
        - query: How do mixture of experts models route tokens to specialized expert networks?
          query_cn: 混合专家模型如何将 token 路由到专门的专家网络？
          enabled: true
          source: manual
          note: ''
        - query: What gating and load balancing techniques improve expert utilization in sparse mixture of experts?
          query_cn: 哪些门控和负载均衡技术能提升稀疏混合专家模型中的专家利用率？
          enabled: true
          source: manual
          note: ''
        - query: How is expert parallelism used to train large mixture of experts models efficiently?
          query_cn: 专家并行如何用于高效训练大型混合专家模型？
          enabled: true
          source: manual
          note: ''
        - query: What are the trade offs of conditional computation and expert capacity in mixture of experts architectures?
          query_cn: 混合专家架构中条件计算与专家容量有哪些权衡？
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-11-12T06:33:45.059Z'
